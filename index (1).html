  /* Dark layer that keeps the title readable */
  body::after {
    content: ""; position: fixed; inset: 0; z-index: -1; pointer-events: none;
    background: linear-gradient(rgba(0,0,0,.72), rgba(0,0,0,.3) 55%, rgba(0,0,0,.5));
  }
  .logo { width: 72px; height: auto; display: block; margin-bottom: 28px; }
  h1 {
    margin: 0 0 36px; padding: .1em .2em; text-align: center; max-width: 100%;
    font-family: 'Big Shoulders Display', sans-serif; font-weight: 600;
    text-transform: uppercase; transform: skewX(-14deg);
    letter-spacing: .18em; text-indent: .18em; word-spacing: .3em;
    font-size: clamp(1.9rem, 8.5vw, 3.8rem); line-height: 1.15;
    color: var(--crimson); /* fallback if gradient text is unsupported */
    /* Light shimmer: a soft highlight sweeps across the red */
    background: linear-gradient(110deg, #b04544 0%, #b04544 40%, #d9726f 50%, #b04544 60%, #b04544 100%);
    background-size: 250% 100%;
    -webkit-background-clip: text; background-clip: text;
    -webkit-text-fill-color: transparent;
    /* Sinking look: letters dissolve into the background toward the bottom... */
    -webkit-mask-image: linear-gradient(to bottom, #000 0%, rgba(0,0,0,.8) 45%, rgba(0,0,0,.12) 100%);
    mask-image: linear-gradient(to bottom, #000 0%, rgba(0,0,0,.8) 45%, rgba(0,0,0,.12) 100%);
    /* ...and look pressed in: dark edge on top, faint light edge below */
    filter: drop-shadow(0 -1px 0 rgba(0,0,0,.75)) drop-shadow(0 1px 0 rgba(255,130,130,.22));
    animation: shimmer 5s linear infinite;
  }
  @keyframes shimmer { from { background-position: 150% 0; } to { background-position: -50% 0; } }
  @media (prefers-reduced-motion: reduce) { h1 { animation: none; } }
  main { width: 100%; max-width: 440px; }
  .song { margin-bottom: 48px; text-align: center; }
  .song h2 { margin: 0 0 4px; font-size: 1.1rem; font-weight: 400; }
  .song p { margin: 0 0 16px; color: var(--muted); font-size: .9rem; }
  audio { width: 100%; }
  form { display: flex; flex-direction: column; gap: 12px; }
  form h2 { margin: 0; font-size: 1.1rem; font-weight: 400; text-align: center; }
  form p { margin: 0 0 8px; color: var(--muted); font-size: .9rem; text-align: center; }
  input[type="email"] {
    width: 100%; padding: 14px 16px;
    background: rgba(0,0,0,.55); color: var(--text);
    border: 1px solid rgba(255,255,255,.22); border-radius: 2px;
    font: inherit; font-size: 1rem;
  }
  input[type="email"]::placeholder { color: #666; }
  input[type="email"]:focus-visible, button:focus-visible, a:focus-visible {
    outline: 2px solid var(--crimson); outline-offset: 2px;
  }
  button {
    padding: 14px 16px; cursor: pointer;
    background: var(--crimson); color: #fff;
    border: 0; border-radius: 2px;
    font: inherit; font-size: 1rem; font-weight: 400; letter-spacing: .04em;
  }
  button:hover { background: #963a39; }
  .hp { position: absolute; left: -9999px; }
  .social { margin-top: 40px; display: flex; gap: 24px; justify-content: center; }
  .social a { color: var(--muted); text-decoration: none; font-size: .95rem; }
  .social a:hover { color: var(--crimson); }
</style>
</head>
